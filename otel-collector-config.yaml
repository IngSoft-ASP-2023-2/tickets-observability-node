receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "*"

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  resourcedetection:
    detectors: [env, system]
    timeout: 2s

exporters:
  # Envío al stack Grafana LGTM local (all-in-one)
  otlp/lgtm:
    endpoint: lgtm:4317
    tls:
      insecure: true

  debug:
    verbosity: basic

  # --- Grafana Cloud (opcional, ver docs/grafana-cloud.md) ---
  # El endpoint de Grafana Cloud (…grafana.net/otlp) es OTLP/HTTP, no gRPC.
  # Por eso usamos `otlphttp`, no `otlp`. El collector agrega automáticamente
  # /v1/traces, /v1/metrics, /v1/logs según el signal.
  otlphttp/cloud:
    endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}
    headers:
      authorization: Basic ${env:GRAFANA_CLOUD_AUTH}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlp/lgtm, otlphttp/cloud, debug]
    metrics:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlp/lgtm, otlphttp/cloud, debug]
    logs:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlp/lgtm, otlphttp/cloud, debug]
