apiVersion: 1

providers:
  - name: tickets
    orgId: 1
    folder: 'Tickets Observability'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
