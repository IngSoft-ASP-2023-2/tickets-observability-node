<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tickets · Observability Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="./otel.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-slate-900 text-white p-6 shadow">
    <h1 class="text-2xl font-bold">🎟️ Tickets · Observability Demo</h1>
    <p class="text-sm text-slate-300">Node.js / NestJS · OpenTelemetry · Grafana LGTM</p>
  </header>

  <main class="max-w-4xl mx-auto p-6 space-y-8">
    <section>
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-xl font-semibold">Eventos disponibles</h2>
        <button id="reload" class="text-sm bg-slate-200 hover:bg-slate-300 px-3 py-1 rounded">Recargar</button>
      </div>
      <div id="events" class="grid gap-3"></div>
    </section>

    <section class="border-t pt-6">
      <h2 class="text-xl font-semibold mb-3">Consultar reserva</h2>
      <div class="flex gap-2">
        <input id="bookingId" type="text" placeholder="bookingId (UUID)"
               class="flex-1 border rounded px-3 py-2 text-sm" />
        <button id="lookup" class="bg-slate-900 text-white px-4 py-2 rounded text-sm hover:bg-slate-700">
          Buscar
        </button>
      </div>
      <pre id="bookingResult" class="mt-3 bg-slate-900 text-green-300 p-3 rounded text-xs overflow-x-auto min-h-[3rem]"></pre>
    </section>

    <section class="border-t pt-6 text-xs text-slate-500">
      Grafana: <a class="underline" href="http://localhost:3001" target="_blank">http://localhost:3001</a>
      · Traces (Tempo), Metrics (Prometheus), Logs (Loki)
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
