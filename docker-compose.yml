services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  # Grafana LGTM all-in-one: Grafana + Loki + Tempo + Prometheus.
  # UI en http://localhost:3001 (login anónimo, rol Admin).
  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3001:3000"  # Grafana UI (mapeado a 3001 para evitar choques con otros procesos)
      - "4319:4317"  # OTLP gRPC interno (no lo usamos directo)
      - "4320:4318"  # OTLP HTTP interno (no lo usamos directo)
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      # Auto-provisioning: al levantar aparecen 4 dashboards en la carpeta
      # "Tickets Observability" sin necesidad de importarlos a mano.
      - ./grafana/provisioning/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    environment:
      # Pasadas al collector solo si están definidas en .env; ignoradas si no.
      - GRAFANA_CLOUD_OTLP_ENDPOINT
      - GRAFANA_CLOUD_AUTH
    ports:
      - "4317:4317"   # OTLP gRPC (usado por los servicios Node)
      - "4318:4318"   # OTLP HTTP (usado por el navegador vía nginx)
    depends_on:
      - lgtm

  events-service:
    build:
      context: .
      dockerfile: apps/events-service/Dockerfile
    environment:
      - EVENTS_PORT=5001
      - REDIS_URL=redis://redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SEMCONV_STABILITY_OPT_IN=http
    ports:
      - "5001:5001"
    depends_on:
      - redis
      - otel-collector

  booking-service:
    build:
      context: .
      dockerfile: apps/booking-service/Dockerfile
    environment:
      - BOOKING_PORT=5002
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - EVENTS_SERVICE_URL=http://events-service:5001
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SEMCONV_STABILITY_OPT_IN=http
    ports:
      - "5002:5002"
    depends_on:
      - dynamodb-local
      - events-service
      - otel-collector
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    ports:
      - "8091:80"
    depends_on:
      - events-service
      - booking-service
      - otel-collector
